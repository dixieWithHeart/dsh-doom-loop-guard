# dsh-doom-loop-guard —— 宿主行
#
# insert 段由 bundle 自带，装到 profile 后自动生效。
# 这里是启动默认值；设置页写入 ~/.dsh/dsh-doom-loop-guard.json，优先级更高。
- insert:
    - id: dsh-doom-loop-guard
      name: 'dsh-doom-loop-guard'
      config:
        # 实时检测总开关
        enabled: true
        # 防护等级：relaxed / standard / sensitive
        preset: standard
        # 命中处置：observe / nudge / cut
        intervention: nudge
        # 生效门槛（上下文占用 %），0 为全程
        warnAbovePercent: 0
        # cut 后自动续跑
        autoResume: true
        # 连续截断上限
        maxConsecutiveCuts: 3
        # 提示音
        soundEnabled: true
        soundCooldownMs: 5000
        # 自定义音频路径，留空用内置
        soundPath: ''
        # 历史扫描范围
        reportDays: 7
        reportLimit: 20
